<svg id="tree-svg" width="342" height="319" viewBox="18 -6.857143402099609 342 319" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><style>#tree-svg { display: block; cursor: grab; }
#tree-svg:active { cursor: grabbing; }
#tree-svg .link { fill: none; stroke: rgb(187, 187, 187); stroke-width: 1px; }
#tree-svg .node-leaf rect { stroke: rgb(136, 136, 136); stroke-width: 0.5px; }
#tree-svg .node-internal circle { fill: rgb(255, 255, 255); stroke: rgb(85, 85, 85); stroke-width: 1px; }
#tree-svg .node-leaf text { font: 9px monospace; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
#tree-svg .node-leaf .leaf-char { font-size: 10px; font-weight: 600; }
#tree-svg .node-leaf .leaf-char-hex { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: normal; font-size: 9px; }
#tree-svg .flat-box { fill: rgb(34, 197, 94); stroke: rgb(217, 119, 6); stroke-dasharray: 3, 2; stroke-width: 1.5px; pointer-events: none; }
#tree-svg .pair-box { fill: rgb(34, 197, 94); stroke: rgb(148, 163, 184); stroke-dasharray: 2, 2; stroke-width: 1px; pointer-events: none; }
#tree-svg .flat-label { font: 600 10px monospace; fill: rgb(180, 83, 9); pointer-events: none; }
#tree-svg .pair-label { font: 9px monospace; fill: rgb(100, 116, 139); pointer-events: none; }
#tree-svg .skew-bar { stroke: rgb(68, 68, 68); stroke-width: 0.3px; }
#tree-svg .prim-bubble rect { fill: rgb(255, 237, 213); stroke: rgb(194, 65, 12); stroke-width: 0.5px; }
