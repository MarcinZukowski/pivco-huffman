     * separately — at the root's vertical level, off to its right —
     * so they sit alongside the tree rather than crowding the title /
     * source-strip column. */
    {
        const treeBBox = gWorld.node().getBBox();
        const hasTitle  = !!(meta.titleText && meta.titleText.length);
        const labelKeys = meta.showLabels
            ? meta.showLabels.split(',').map(s => s.trim()).filter(Boolean)
            : [];
        const hasLabels = labelKeys.length > 0 && meta.stats;
        const hasStrip  = inputActive && meta.sourceTrace.length > 0;
        const labelLineH = 14;
        const gapToTree  = hasStrip ? 22 : 8;   /* more breathing room
                                                  when strip is shown */
        const gapBetween = 10;
        const titleH     = 18;
        const stripH     = 36;  /* 3 rows × ~12 px */

        /* Stack source-strip + title upward from the tree top. */
        let bottomY = treeBBox.y - gapToTree;

        if (hasStrip) {
            const stripBottomY = bottomY;
            renderSourceStrip(treeBBox, meta.sourceTrace,
                               letterColor, stripBottomY);
            /* Horizontal separator between the strip's index row and
             * the root bitmap — spans the full tree width so the
             * "source side" and "decode side" of the figure read as
             * two stacked panels. */
            const sepY = (stripBottomY + treeBBox.y) / 2;
            gWorld.append('line')
                .attr('class', 'source-tree-sep')
                .attr('x1', treeBBox.x)
                .attr('x2', treeBBox.x + treeBBox.width)
                .attr('y1', sepY)
                .attr('y2', sepY)
                .style('stroke', '#888')
                .style('stroke-width', 1);
            bottomY = stripBottomY - stripH - gapBetween;
        }
        if (hasTitle) {
            gWorld.append('text')
                .attr('class', 'tree-title')
                .attr('x', treeBBox.x + treeBBox.width / 2)
                .attr('y', bottomY)
                .attr('text-anchor', 'middle')
                .style('font', '14px sans-serif')
                .style('font-weight', 600)
                .style('fill', '#222')
                .text(meta.titleText);
            bottomY -= titleH;
        }

        /* Labels at the ROOT's vertical level, right-aligned to the
         * right edge of the rightmost leaf so the label column hugs
         * the tree's right boundary regardless of width. */
        if (hasLabels) {
            const leafXs = root.leaves().map(n => n.x);
            const rightmostLeafX = leafXs.length
                ? Math.max(...leafXs)
                : treeBBox.x + treeBBox.width;
            const labelX = rightmostLeafX + leafSize / 2;
            const blockH = (labelKeys.length - 1) * labelLineH;
            let labelY0 = (root.y || treeBBox.y) - blockH / 2;
            let y = labelY0;
            for (const key of labelKeys) {
                const fn = LABEL_VOCAB[key];
                const line = fn ? fn(meta.stats) : `${key}: ?`;
                gWorld.append('text')
                    .attr('class', 'tree-label')
                    .attr('x', labelX)
                    .attr('y', y)
                    .attr('text-anchor', 'end')
                    .style('font', '11px monospace')
                    .style('fill', '#444')
                    .text(line);
                y += labelLineH;
            }
        }

        /* "show bitmaps requires text" error — shown when the user
         * enabled the toggle but the data source isn't a text input. */
        if (bmNeedsText) {
            gWorld.append('text')
                .attr('class', 'bm-error')
                .attr('x', treeBBox.x + treeBBox.width / 2)
                .attr('y', treeBBox.y - 8)
                .attr('text-anchor', 'middle')
                .style('font', '12px sans-serif')
                .style('font-weight', 500)
                .style('fill', '#b91c1c')
                .text('"input bitmap" / "show bitmaps" need a text source (type into the text input above)');
        }
    }

    /* crop-top preview + export box.  Draw a cut line + dimmed region
     * over the part that the export will drop, and remember the x-extent
     * of the kept (top) nodes so the export can also narrow the width. */
    gWorld.selectAll('.crop-overlay').remove();
    _cropExportBox = null;
    const cropTop = getCropTopFrac();
    if (cropTop) {
        const cb = gWorld.node().getBBox();
        const cutY = cb.y + cb.height * cropTop;
        // x-extent of nodes kept above the cut (+ margin for bars/labels).
        let minX = Infinity, maxX = -Infinity;
        root.descendants().forEach(n => {
            if (n.y <= cutY) { minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x); }
        });
        if (minX === Infinity) { minX = cb.x; maxX = cb.x + cb.width; }
        const xpad = 46;   // skew bar (~28) + right-side labels
        _cropExportBox = { x: minX - xpad, y: cb.y,
                           w: (maxX - minX) + 2 * xpad, cutY };
        gWorld.append('rect').attr('class', 'crop-overlay')
            .attr('x', cb.x).attr('y', cutY)
            .attr('width', cb.width).attr('height', cb.y + cb.height - cutY)
            .attr('fill', '#fff').attr('opacity', 0.6)
            .attr('pointer-events', 'none');
        gWorld.append('line').attr('class', 'crop-overlay')
            .attr('x1', cb.x).attr('x2', cb.x + cb.width)
            .attr('y1', cutY).attr('y2', cutY)
            .attr('stroke', '#c0392b').attr('stroke-width', 1.2)
            .attr('stroke-dasharray', '5 3').attr('pointer-events', 'none');
    }

    // Initial fit-to-pane: recompute bbox so overlay is included.
    const bbox = gWorld.node().getBBox();
    const scale = Math.min(
        (W - 20) / Math.max(1, bbox.width),
        (H - 20) / Math.max(1, bbox.height),
        1.4
    );
    const tx = (W - bbox.width * scale) / 2 - bbox.x * scale;
    const ty = (H - bbox.height * scale) / 2 - bbox.y * scale;
    _fitTransform = d3.zoomIdentity.translate(tx, ty).scale(scale);
    svg.call(zoom.transform, _fitTransform);
}
let _cropExportBox = null;
let _fitTransform = null;
function resetView() {
    if (_fitTransform) svg.call(zoom.transform, _fitTransform);
}

/* Click handler for a flattenable node (subtree is D≥2 flat).
 *
 * Two cases:
 *   1. Node was already unflattened (override 'unflatten' set, not
 *      currently treated as flat) → re-flatten just this one.
 *   2. Node is currently treated as flat → unflatten it AND every
 *      ancestor on the path to root (so the path stays "open"),
 *      AND re-flatten every off-path sibling subtree (clear their
 *      overrides so the auto-detector reflattens them).  This
 *      gives "focus on a path through the tree" semantics: only
 *      one branch from root is fully expanded, everything else
 *      stays as compact as possible.
 */
function toggleFlatten(nodeId) {
    const node = _nodeById.get(nodeId);
    if (!node || !node.flatCandidate) return;

    const isCurrentlyFlat = node.flatD > 0;
    const wasUnflattened  = _flatOverride.get(nodeId) === 'unflatten';

    /* Recursive helper used by both branches. */
    function clearOverridesInSubtree(n) {
        if (!n) return;
        _flatOverride.delete(n.id);
        if (n.symbol < 0) {
            clearOverridesInSubtree(n.left);
            clearOverridesInSubtree(n.right);
        }
    }

    if (wasUnflattened && !isCurrentlyFlat) {
        /* Re-flatten just this one node.  Also clear any stale
         * overrides INSIDE its subtree — those are unobservable
         * once this node is flat (subtree is absorbed), but they'd
         * resurface unexpectedly the next time an ancestor is
         * unflattened.  See the "click A, L, A, L → no-op" bug. */
        _flatOverride.delete(nodeId);
        clearOverridesInSubtree(node.left);
        clearOverridesInSubtree(node.right);
        refreshFromFreqs();
        return;
    }

    /* Otherwise: unflatten this + ancestor chain.  We don't touch
     * sibling subtrees — siblings without overrides will auto-flatten
     * if they're structurally flat, and siblings the user explicitly
     * unflattened earlier should stay unflattened (otherwise clicking
     * B after A flattens A again, which is wrong). */
    let cur = node;
    while (cur) {
        _flatOverride.set(cur.id, 'unflatten');
        cur = cur.parent;
    }
    refreshFromFreqs();
}

// ============================================================
//  Stats panel
// ============================================================

/* Single source of truth for tree-level aggregates.  Called once per
 * refresh; the result is consumed by both renderStats (the summary
 * panel) and the optional title / top-right labels overlay drawn by
 * renderTree. */
function computeTreeStats(rootNode, meta) {
    const totalN = meta.totalN;
    let totalEntropyBits = 0;
    let totalBitsSaved = 0;
    let nFlat = 0;
    let flatRawBits = 0;
    function walkAgg(n) {
        if (!n || n.symbol >= 0) return;
        if (meta.showFlat && n.flatD) {
            totalEntropyBits += n.subtreeCount * n.flatD;
            nFlat++;
            flatRawBits += n.subtreeCount * n.flatD;
            return;
        }
        totalEntropyBits += n.subtreeCount * n.bitEntropy;
        totalBitsSaved += n.bitsSavedTotal;
        walkAgg(n.left); walkAgg(n.right);
    }
    walkAgg(rootNode);

    let hufWeighted = 0;
    let byteEntropy = 0;
    let n_leaves = 0;
    let longestCode = 0;
    let opsSimpleSum = 0;
    let opsWeightedSum = 0;
    function walkLeaves(n) {
        if (!n) return;
        if (n.symbol >= 0) {
            n_leaves++;
            if (n.depth > longestCode) longestCode = n.depth;
            const p = n.freq / totalN;
            /* opsToLeaf is set by annotateLeafOps based on the primitive
             * chain — already reflects show-flat, constant, fuse-leaves. */
            const ops = (n.opsToLeaf != null) ? n.opsToLeaf : n.depth;
            opsSimpleSum   += ops;
            if (p > 0) {
                hufWeighted    += p * n.depth;
                byteEntropy    -= p * Math.log2(p);
                opsWeightedSum += p * ops;
            }
            return;
        }
        walkLeaves(n.left); walkLeaves(n.right);
    }
    walkLeaves(rootNode);

    return {
        totalN, n_leaves, longestCode,
        totalEntropyBits, totalBitsSaved, nFlat, flatRawBits,
        hufWeighted, byteEntropy,
        opsSimple: n_leaves ? (opsSimpleSum / n_leaves) : 0,
        opsW:      opsWeightedSum,
    };
}

/* Colour palette for source-character labels in the "show bitmaps"
 * overlay.  Stable per character within a render so x_0 and x_1
 * share a colour distinct from y_0 etc.  Tableau-style hues, picked
 * to stay distinguishable on white. */
const LETTER_PALETTE = [
    '#1f77b4', '#d62728', '#2ca02c', '#9467bd', '#ff7f0e',
    '#8c564b', '#e377c2', '#17becf', '#bcbd22', '#7f7f7f',
];
function buildLetterColors(trace) {
    const m = new Map();
    for (const p of trace) {
        if (!m.has(p.char)) {
            m.set(p.char, LETTER_PALETTE[m.size % LETTER_PALETTE.length]);
        }
    }
    return m;
}

/* Render a "letter_idx" tag as SVG text with the index as a true
 * subscript (smaller font, baseline-shifted).  Centred at (x, y). */
function appendLetterIdxTag(parent, x, y, letter, idx,
                            fontSize, color, weight) {
    const t = parent.append('text')
        .attr('x', x).attr('y', y)
        .attr('text-anchor', 'middle')
        .style('font', `${fontSize}px monospace`)
        .style('font-weight', weight || 400)
        .style('fill', color);
    t.append('tspan').text(letter);
    t.append('tspan')
        .attr('baseline-shift', 'sub')
        .attr('font-size', '0.72em')
        .text(idx);
    return t;
}

/* Render the 3-row source-trace strip above the tree:
 *     row 1: each character, centered over its codeLen columns
 *     row 2: per-bit binary value
 *     row 3: "letter_b" tag (b = bit index INSIDE that character's
 *            code, not the global source position), coloured per
 *            letter, with b as a true subscript.
 * Thin vertical separators between adjacent characters so the column
 * groups are visually distinct.  Bottom row anchored at stripBottomY
 * (just above the tree); strip centred horizontally over treeBBox. */
function renderSourceStrip(treeBBox, trace, letterColor, stripBottomY) {
    const cellW = 14;
    const charY = stripBottomY - 24;
    const bitY  = stripBottomY - 12;
    const idxY  = stripBottomY;
    const totalBits = trace.reduce((s, p) => s + p.codeLen, 0);
    if (totalBits === 0) return;
    const stripWidth = totalBits * cellW;
    const stripX0 = treeBBox.x + treeBBox.width / 2 - stripWidth / 2;
    const dividerYTop    = charY - 10;
    const dividerYBottom = idxY  + 4;

    let col = 0;
    for (let pi = 0; pi < trace.length; pi++) {
        const p = trace[pi];
        const color = letterColor.get(p.char) || '#333';
        const charX0 = stripX0 + col * cellW;
        const charX1 = charX0 + p.codeLen * cellW;
        /* Divider BEFORE this character (skip the very first). */
        if (pi > 0) {
            gWorld.append('line')
                .attr('class', 'src-divider')
                .attr('x1', charX0).attr('y1', dividerYTop)
                .attr('x2', charX0).attr('y2', dividerYBottom)
                .style('stroke', '#bbb')
                .style('stroke-width', 0.5);
        }
        /* Character label, centred over its codeLen-cell span. */
        gWorld.append('text')
            .attr('class', 'src-char')
            .attr('x', (charX0 + charX1) / 2)
            .attr('y', charY)
            .attr('text-anchor', 'middle')
            .style('font', '13px monospace')
            .style('font-weight', 600)
            .style('fill', color)
            .text(p.char);
        for (let b = 0; b < p.codeLen; b++) {
            const cx = charX0 + (b + 0.5) * cellW;
            gWorld.append('text')
                .attr('class', 'src-bit')
                .attr('x', cx).attr('y', bitY)
                .attr('text-anchor', 'middle')
                .style('font', '11px monospace')
                .style('font-weight', 600)
                .style('fill', '#222')
                .text(p.code[b]);
            appendLetterIdxTag(gWorld, cx, idxY, p.char, b,
                                9, color, 500);
        }
        col += p.codeLen;
    }
    /* Final right-side divider for symmetry. */
    gWorld.append('line')
        .attr('class', 'src-divider')
        .attr('x1', stripX0 + totalBits * cellW)
        .attr('y1', dividerYTop)
        .attr('x2', stripX0 + totalBits * cellW)
        .attr('y2', dividerYBottom)
        .style('stroke', '#bbb')
        .style('stroke-width', 0.5);
    /* Leading divider so both ends are bracketed. */
    gWorld.append('line')
        .attr('class', 'src-divider')
        .attr('x1', stripX0).attr('y1', dividerYTop)
        .attr('x2', stripX0).attr('y2', dividerYBottom)
        .style('stroke', '#bbb')
        .style('stroke-width', 0.5);
}

/* Render the bitmap entering one internal node.  Centred horizontally
 * on the node; bit values on top, "letter_b" tags below with b as a
 * subscript (b = bit-index inside that letter's code).  Positioned
 * well above the node circle so neither the circle nor the parent
 * link line crowds the labels. */
function renderNodeBitmap(g, bitmap, letterColor, labelMode, D) {
    if (!bitmap || bitmap.length === 0) return;
    labelMode = labelMode || 'nothing';
    D = D || 1;
    const cellW = 12;
    const bitY = -34;
    const idxY = -22;
    const bg = g.append('g').attr('class', 'node-bitmap');

    if (D <= 1) {
        /* 1-bit partition (ordinary internal node). */
        const w = bitmap.length * cellW;
        const x0 = -w / 2;
        bg.append('rect')
            .attr('x', x0 - 2).attr('y', bitY - 10)
            .attr('width', w + 4).attr('height', 13)
            .attr('rx', 3).attr('fill', '#f8fafc')
            .attr('stroke', '#cbd5e1').attr('stroke-width', 0.6);
        bitmap.forEach((e, i) => {
            const cx = x0 + (i + 0.5) * cellW;
            bg.append('text')
                .attr('x', cx).attr('y', bitY)
                .attr('text-anchor', 'middle')
                .style('font', '10px monospace').style('font-weight', 600)
                .style('fill', '#222').text(e.bit);
            const color = letterColor.get(e.char) || '#666';
            if (labelMode === 'code_bits') {
                appendLetterIdxTag(bg, cx, idxY, e.char, e.bitIdx, 8, color, 500);
            } else if (labelMode === 'symbols' || labelMode === 'indices') {
                bg.append('text')
                    .attr('x', cx).attr('y', idxY)
                    .attr('text-anchor', 'middle')
                    .style('font', '8px monospace').style('font-weight', 500)
                    .style('fill', color)
                    .text(labelMode === 'symbols' ? e.char : e.sourceIdx);
            }
        });
        return;
    }

    /* Flat region: one D-bit group per element (the in-subtree local
     * code), with a gap between groups and the symbol/index label centred
     * under its group so labels line up with their D bits. */
    const GROUP_GAP = 5;
    const groupW = D * cellW;
    const totalW = bitmap.length * groupW + Math.max(0, bitmap.length - 1) * GROUP_GAP;
    const x0 = -totalW / 2;
    bitmap.forEach((e, gi) => {
        const gx = x0 + gi * (groupW + GROUP_GAP);
        const color = letterColor.get(e.char) || '#666';
        bg.append('rect')
            .attr('x', gx - 1).attr('y', bitY - 10)
            .attr('width', groupW + 2).attr('height', 13)
            .attr('rx', 3).attr('fill', '#f8fafc')
            .attr('stroke', '#cbd5e1').attr('stroke-width', 0.6);
        const code = e.code || '';
        for (let b = 0; b < D; b++) {
            const cx = gx + (b + 0.5) * cellW;
            bg.append('text')
                .attr('x', cx).attr('y', bitY)
                .attr('text-anchor', 'middle')
                .style('font', '10px monospace').style('font-weight', 600)
                .style('fill', '#222')
                .text(code[b] != null ? code[b] : '');
        }
        if (labelMode === 'symbols' || labelMode === 'indices'
            || labelMode === 'code_bits') {
            bg.append('text')
                .attr('x', gx + groupW / 2).attr('y', idxY)
                .attr('text-anchor', 'middle')
                .style('font', '8px monospace').style('font-weight', 500)
                .style('fill', color)
                .text(labelMode === 'indices' ? e.sourceIdx : e.char);
        }
    });
}

/* ============================================================
 *  Pivot view — wavelet-tree-style "pivot" the ph encoder performs.
 *
 *  Top strip:   the source string with binary codes + letter_b tags
 *               (chars/codes wrapped in rounded boxes per character).
 *  Before panel (left): one ROW per source byte, each row wrapped in
 *               a rounded box around its bits.
 *  Arrow →
 *  After panel (right): one ROW per tree DEPTH (depth 0 on top, then
 *               1, 2, …).  Within a row, the per-internal-node
 *               bitmaps at that depth sit side-by-side, each in its
 *               own rounded box and labelled with the bit-prefix
 *               ("0"/"1"/"10"/etc.).  Each bitmap entry shows the
 *               bit, a colored `letter_b` tag below, and a bold left-
 *               anchored `*` immediately after the bit when this is
 *               the source byte's terminating bit.
 *  Selected via `view=pivot` URL param.
 * ============================================================ */
function renderPivot(tree, meta) {
    gWorld.selectAll('*').remove();
    svg.call(zoom.transform, d3.zoomIdentity);

    if (!meta.sourceTrace || meta.sourceTrace.length === 0) {
        gWorld.append('text')
            .attr('x', 30).attr('y', 50)
            .style('font', '13px sans-serif')
            .style('fill', '#b91c1c')
            .text('pivot view requires a text data source — type a string into the text input.');
        _fitTransform = d3.zoomIdentity;
        return;
    }

    const trace = meta.sourceTrace;
    const letterColor = buildLetterColors(trace);

    /* Layout constants. */
    const cellW       = 16;   /* bit cell width (top strip + before panel) */
    const rowH        = 20;   /* per-position row height (before + after panels) */
    const charLabelW  = 22;   /* leading "char:" col in before panel */
    const xMargin     = 30;
    const yMargin     = 26;
    const groupPad    = 4;    /* padding inside each rounded codeword box */
    const boxFill     = '#f8fafc';
    const boxStroke   = '#cbd5e1';

    /* ===== 1. Source strip ============================================
     * Per character: a rounded box around the bits + char/tag pair. */
    const totalBits = trace.reduce((s, p) => s + p.codeLen, 0);
    const stripBaseX = xMargin;
    const stripBoxY  = yMargin;
    const stripBoxH  = 52;
    const stripCharY = stripBoxY + 14;
    const stripBitY  = stripBoxY + 30;
    const stripIdxY  = stripBoxY + 46;
    let col = 0;
    for (let pi = 0; pi < trace.length; pi++) {
        const p = trace[pi];
        const color = letterColor.get(p.char) || '#333';
        const x0 = stripBaseX + col * cellW;
        const x1 = x0 + p.codeLen * cellW;
        /* Rounded box around the binary code only (not the char or
         * letter_b subscripts) — emphasizes that the code is what
         * gets pivoted down into the after-panel bitmaps.  Inset so
         * adjacent characters' boxes leave a visible gap. */
        gWorld.append('rect')
            .attr('x', x0 + 2).attr('y', stripBitY - 11)
            .attr('width', (x1 - x0) - 4).attr('height', 16)
            .attr('rx', 4)
            .attr('fill', boxFill).attr('stroke', boxStroke)
            .attr('stroke-width', 0.7);
        gWorld.append('text')
            .attr('x', (x0 + x1) / 2).attr('y', stripCharY)
            .attr('text-anchor', 'middle')
            .style('font', '13px monospace')
            .style('font-weight', 600)
            .style('fill', color)
            .text(p.char);
        for (let b = 0; b < p.codeLen; b++) {
            const cx = x0 + (b + 0.5) * cellW;
            gWorld.append('text')
                .attr('x', cx).attr('y', stripBitY)
                .attr('text-anchor', 'middle')
                .style('font', '12px monospace')
                .style('font-weight', 600)
                .style('fill', '#222')
                .text(p.code[b]);
            appendLetterIdxTag(gWorld, cx, stripIdxY, p.char, b,
                                10, color, 500);
        }
        col += p.codeLen;
    }
    const stripWidth = totalBits * cellW;
    const stripBoxBottom = stripBoxY + stripBoxH;

    /* ===== 2. Vertical down-arrow between top strip and before panel.
     * Placed roughly under the first bit so it visually anchors the
     * "this is what gets pivoted" reading order. */
    const sepY = stripBoxBottom + 18;     /* still used as a y reference */
    const arrowDownX  = stripBaseX + cellW + 4;
    const arrowDownY0 = stripBoxBottom + 2;
    const arrowDownY1 = sepY + 6;         /* tip of arrow head */
    gWorld.append('line')
        .attr('x1', arrowDownX).attr('y1', arrowDownY0)
        .attr('x2', arrowDownX).attr('y2', arrowDownY1 - 4)
        .style('stroke', '#666').style('stroke-width', 1.5);
    gWorld.append('polygon')
        .attr('points', [
            [arrowDownX, arrowDownY1].join(','),
            [arrowDownX - 4, arrowDownY1 - 7].join(','),
            [arrowDownX + 4, arrowDownY1 - 7].join(','),
        ].join(' '))
        .style('fill', '#666');

    /* ===== 3. Before panel — per-source-position rows =============== */
    const beforeBaseX = xMargin;
    const beforeBaseY = sepY + 20;
    const maxCodeLen = Math.max(...trace.map(p => p.codeLen));

    trace.forEach((p, i) => {
        const yRow = beforeBaseY + i * rowH;
        const color = letterColor.get(p.char) || '#333';
        const bitsX0 = beforeBaseX + charLabelW;
        const bitsX1 = bitsX0 + p.codeLen * cellW;
        /* Rounded box around the bit cells (excludes the char label). */
        gWorld.append('rect')
            .attr('x', bitsX0 - groupPad)
            .attr('y', yRow - rowH / 2 + 2)
            .attr('width', (bitsX1 - bitsX0) + 2 * groupPad)
            .attr('height', rowH - 4)
            .attr('rx', 4)
            .attr('fill', boxFill).attr('stroke', boxStroke)
            .attr('stroke-width', 0.7);
        /* Leading char (outside the box). */
        gWorld.append('text')
            .attr('x', beforeBaseX + 2).attr('y', yRow + 4)
            .attr('text-anchor', 'start')
            .style('font', '12px monospace')
            .style('font-weight', 600)
            .style('fill', color)
            .text(p.char);
        for (let b = 0; b < p.codeLen; b++) {
            const cx = bitsX0 + (b + 0.5) * cellW;
            gWorld.append('text')
                .attr('x', cx).attr('y', yRow + 4)
                .attr('text-anchor', 'middle')
                .style('font', '12px monospace')
                .style('font-weight', 600)
                .style('fill', '#222')
                .text(p.code[b]);
        }
    });
    const beforeWidth = charLabelW + maxCodeLen * cellW + 2 * groupPad;

    /* ===== 4. Arrow between panels =================================== */
    const arrowX = beforeBaseX + beforeWidth + 18;
    const arrowY = beforeBaseY + (trace.length - 1) * rowH / 2 + 4;
    gWorld.append('text')
        .attr('x', arrowX).attr('y', arrowY + 6)
        .style('font', '26px sans-serif')
        .style('fill', '#666')
        .text('→');

    /* ===== 5. After panel — per-depth COLUMNS of vertical bitmaps ==
     * Each internal node's bitmap is rendered VERTICALLY: one entry per
     * row, top-to-bottom.  Per row: [letter_b tag] [bit] [* if end].
     * Bitmaps at the same tree depth (= bitPrefix.length) stack
     * vertically within a single column; different depths sit side-by-
     * side as separate columns. */
    const internals = collectInternals(tree)
        .filter(n => n.bitmap && n.bitmap.length > 0);
    const byDepth = new Map();
    let maxDepth = 0;
    for (const n of internals) {
        const d = (n.bitPrefix || '').length;
        if (!byDepth.has(d)) byDepth.set(d, []);
        byDepth.get(d).push(n);
        if (d > maxDepth) maxDepth = d;
    }

    const afterBaseX        = arrowX + 40;
    /* Lift the after-panel so its boxes start near the before-panel's
     * top row, but not so high the bitmap label crosses the separator
     * line above.  Tuned to leave a few px of clearance under the
     * separator. */
    const afterBaseY        = beforeBaseY - 18;
    const colTagW           = 14;   /* letter_b tag column inside bitmap */
    const colBitW           = 12;   /* bit value column */
    const colStarW          = 14;   /* terminator marker column */
    const bitmapInnerW      = colTagW + colBitW + colStarW;
    const bitmapBoxPadX     = 6;
    const bitmapBoxPadY     = 4;
    const bitmapBoxW        = bitmapInnerW + 2 * bitmapBoxPadX;
    const bitmapLabelH      = 16;   /* `"10":` header above each bitmap */
    const bitmapStackGap    = 14;   /* gap between stacked same-depth bitmaps */
    const depthColGap       = 18;   /* gap between depth columns */

    for (let d = 0; d <= maxDepth; d++) {
        const bitmaps = byDepth.get(d) || [];
        if (!bitmaps.length) continue;
        const colX = afterBaseX + d * (bitmapBoxW + depthColGap);
        let yCursor = afterBaseY;
        for (const node of bitmaps) {
            const prefix = node.bitPrefix || '';
            const label = prefix === '' ? '"":' : `"${prefix}":`;
            /* Header label. */
            gWorld.append('text')
                .attr('x', colX + bitmapBoxPadX).attr('y', yCursor + 12)
                .attr('text-anchor', 'start')
                .style('font', '11px monospace')
                .style('font-weight', 600)
                .style('fill', '#555')
                .text(label);
            const boxY0 = yCursor + bitmapLabelH;
            const nRows = node.bitmap.length;
            const boxH = nRows * rowH + 2 * bitmapBoxPadY;
            const tagX  = colX + bitmapBoxPadX + colTagW / 2;
            const bitX  = colX + bitmapBoxPadX + colTagW + colBitW / 2;
            const starX = colX + bitmapBoxPadX + colTagW + colBitW + 1;
            /* Rounded box around the bit COLUMN only (letter_b tags
             * and the terminator * sit outside the bubble — matches
             * the top-strip + tree-view convention of bubbling just
             * the digits). */
            gWorld.append('rect')
                .attr('x', bitX - colBitW / 2 - 3)
                .attr('y', boxY0)
                .attr('width', colBitW + 6)
                .attr('height', boxH)
                .attr('rx', 4)
                .attr('fill', boxFill).attr('stroke', boxStroke)
                .attr('stroke-width', 0.7);
            node.bitmap.forEach((e, ei) => {
                const yRow = boxY0 + bitmapBoxPadY + (ei + 0.5) * rowH + 4;
                const color = letterColor.get(e.char) || '#333';
                const tracedPos = trace[e.sourceIdx];
                const isEnd = tracedPos &&
                    tracedPos.codeLen === e.bitIdx + 1;
                /* letter_b tag on the left of the row. */
                appendLetterIdxTag(gWorld, tagX, yRow, e.char, e.bitIdx,
                                    11, color, 500);
                /* Bit value, centered. */
                gWorld.append('text')
                    .attr('x', bitX).attr('y', yRow)
                    .attr('text-anchor', 'middle')
                    .style('font', '12px monospace')
                    .style('font-weight', 600)
                    .style('fill', '#222')
                    .text(e.bit);
                /* Terminator marker — larger, bold, immediately to
                 * the right of the bit (close to the left of the
                 * row, not the far right). */
                if (isEnd) {
                    gWorld.append('text')
                        .attr('x', starX).attr('y', yRow + 1)
                        .attr('text-anchor', 'start')
                        .style('font', '14px monospace')
                        .style('font-weight', 700)
                        .style('fill', color)
                        .text('*');
                }
            });
            yCursor = boxY0 + boxH + bitmapStackGap;
        }
    }

    /* Title (if set) above the source strip. */
    if (meta.titleText) {
        gWorld.append('text')
            .attr('x', xMargin)
            .attr('y', yMargin - 8)
            .attr('text-anchor', 'start')
            .style('font', '14px sans-serif')
            .style('font-weight', 600)
            .style('fill', '#222')
            .text(meta.titleText);
    }

    /* Fit-to-pane. */
    const bbox = gWorld.node().getBBox();
    const pane = document.getElementById('tree-pane');
    const W = pane.clientWidth;
    const H = pane.clientHeight;
    const scale = Math.min(
        (W - 20) / Math.max(1, bbox.width),
        (H - 20) / Math.max(1, bbox.height),
        1.4
    );
    const tx = (W - bbox.width * scale) / 2 - bbox.x * scale;
    const ty = (H - bbox.height * scale) / 2 - bbox.y * scale;
    _fitTransform = d3.zoomIdentity.translate(tx, ty).scale(scale);
    svg.call(zoom.transform, _fitTransform);
}

/* Vocabulary for the labels overlay.  Each entry: short key the user
 * types (label-side of show-labels), how to render it as a one-line
 * "name: value" string given the precomputed stats object. */
const LABEL_VOCAB = {
    'N':         (s) => `N: ${s.totalN}`,
    '#symbols':  (s) => `#symbols: ${s.n_leaves}`,
    'depth':     (s) => `depth: ${s.longestCode}`,
    'H':         (s) => `H: ${s.byteEntropy.toFixed(3)} bpb`,
    'huff':      (s) => `Huff: ${s.hufWeighted.toFixed(3)} bpb`,
    'saved':     (s) => `saved: ${s.totalBitsSaved.toFixed(0)} bits`,
    'ops/leaf':  (s) => `ops/leaf: ${s.opsSimple.toFixed(2)}`,
    'ops/byte':  (s) => `ops/byte: ${s.opsW.toFixed(3)}`,
    '#flat':     (s) => `#flat: ${s.nFlat}`,
    'flat-bits': (s) => `flat-bits: ${(s.flatRawBits / s.totalN).toFixed(3)} bpb`,
};

function renderStats(rootNode, meta, stats) {
    const internals = collectInternals(rootNode);
    const totalN = stats.totalN;
    const totalEntropyBits = stats.totalEntropyBits;
    const totalBitsSaved   = stats.totalBitsSaved;
    const nFlat            = stats.nFlat;
    const flatRawBits      = stats.flatRawBits;
    const hufWeighted      = stats.hufWeighted;
    const byteEntropy      = stats.byteEntropy;
    const n_leaves         = stats.n_leaves;
    const longestCode      = stats.longestCode;
    const opsSimple        = stats.opsSimple;
    const opsW             = stats.opsW;

    const summary = document.getElementById('summary');
    summary.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'summary-grid';
    function addRow(k, v, tip) {
        const a = document.createElement('b'); a.textContent = k;
        const b = document.createElement('span'); b.textContent = v;
        if (tip) {
            a.title = tip;
            b.title = tip;
            a.style.borderBottom = '1px dotted #aaa';
            a.style.cursor = 'help';
        }
        grid.appendChild(a); grid.appendChild(b);
    }
    addRow('dataset', meta.name + (meta.isMain ? ' (MAIN)' : ''),
        "Source distribution name.  '(scaled X→Y)' means input was short " +
        "and we proportionally scaled to a standard 8K block for stable stats.");
    addRow('N (source bytes)', totalN.toString(),
        "Total symbol count.  8192 for built-in datasets and short inputs " +
        "scaled up to a standard block.");
    addRow('distinct symbols', n_leaves.toString(),
        "Number of unique byte values with non-zero frequency.  " +
        "Becomes the leaves of the Huffman tree.");
    addRow('code length limit', meta.maxLen + ' bits  (slider)',
        "Maximum Huffman code length allowed by the length-limiter.  " +
        "The slider min is ⌈log₂(distinct symbols)⌉ (needed to address every leaf).");
    addRow('longest code', longestCode + ' bits  (in tree)',
        "Actual longest code length present in this tree.  ≤ the slider limit; " +
        "often smaller if the distribution doesn't need the full range.");
    addRow('byte entropy H', byteEntropy.toFixed(3) + ' bits/byte',
        "Shannon entropy of the byte distribution: H = Σ p · −log₂ p.  " +
        "Ideal lower bound on compressed size.");
    addRow('Huffman avg len', hufWeighted.toFixed(3) + ' bits/byte',
        "Weighted average Huffman code length: Σ p · code_len.  " +
        "What plain Huffman achieves (always ≥ H, gap = redundancy).");
    addRow('tree-level Σ H',
        (totalEntropyBits / totalN).toFixed(3) + ' bits/byte' +
        (meta.showFlat ? ' (entropy + raw flat)' : ' (≈ H, by chain rule)'),
        "When flat-subtrees OFF: Σ over all internals of n·H(p) / N — " +
        "equals byte entropy H exactly (chain rule).  When ON: flat " +
        "regions are accounted as RAW (n·D bits), not entropy.  Result " +
        "= entropy lower bound on what ph would emit today (perfect " +
        "FSE on non-flat bitmaps + raw N·D for flat regions).  Click " +
        "a flat-root (thick circle) to unflatten it and see the gap " +
        "shrink.");
    addRow('total bits saved', totalBitsSaved.toFixed(0) +
            ' bits  (' + (totalBitsSaved / totalN).toFixed(4) + ' / source byte)',
        "Σ over non-flat internal nodes of n_node · (1 − H(p_left)).  " +
        "Total bits a perfect FSE per-bitmap coder would save vs raw " +
        "1-bit-per-symbol-per-level.  Flat regions contribute zero " +
        "savings here (ph emits them raw).");
    addRow('# internal nodes', internals.length.toString(),
        "Number of non-leaf nodes in the tree.  Each internal node is a " +
        "left/right partition step at decode time.");
    /* Operations / leaf — both simple (per-leaf avg, each leaf
     * counted once) and frequency-weighted.  Without and with the
     * flat-subtree fast path. */
    addRow('ops/leaf (avg)', opsSimple.toFixed(2),
        "Average decode primitives per distinct symbol (each leaf counted " +
        "once).  Counts every primitive on the root-to-leaf path (P/MVV/PH/DX/S2/S1, " +
        "but NOT C which is bulk-amortised memset).  Flip show-flat / fuse-leaves / " +
        "constant to see the savings each optimisation contributes.");
    addRow('ops/byte (weighted)', opsW.toFixed(3),
        "Frequency-weighted ops per source byte: Σ p_leaf · ops_to_decode.  " +
        "Same primitive accounting as above, weighted by source byte frequency.");
    if (meta.showFlat) {
        const flatPct = totalN > 0 ? (100 * flatRawBits / (8 * totalN)).toFixed(1) : '-';
        addRow('# maximal flat subtrees', nFlat.toString(),
            "Number of maximal D≥2 flat subtrees in the tree.  ph emits " +
            "each as one packed N·D-bit region instead of D bitmap levels.");
        addRow('flat region bits (raw)', flatRawBits.toFixed(0) +
                '  (' + (flatRawBits / totalN).toFixed(3) + ' / source byte)',
            "Bits ph emits today across all flat regions: Σ n_subtree · D.  " +
            "Raw (no entropy coding) because the leaves under a flat subtree " +
            "are usually near-uniform.  Compare to flat-region entropy floor " +
            "in extras/bench_entropy_breakdown to see the gap.");
    }
    addRow('mode', meta.phOpt ? 'ph-flat-aware' : 'textbook canonical',
        "Code-assignment strategy.  'ph-flat-aware' clusters same-length " +
        "symbols into power-of-2 chunks, creating larger flat subtrees " +
        "(same compression ratio as canonical).  Toggle the 'ph-optimize' " +
        "checkbox to compare.");
    summary.appendChild(grid);

    // Top internal nodes table
    const tbody = document.querySelector('#top-nodes-table tbody');
    tbody.innerHTML = '';
    const sorted = internals.slice().sort((a, b) =>
        b.bitsSavedTotal - a.bitsSavedTotal);
    const topN = Math.min(15, sorted.length);
    for (let i = 0; i < topN; i++) {
        const n = sorted[i];
        const tr = document.createElement('tr');
        if (n.inFlat || n.flatD) tr.classList.add('in-flat');
        tr.dataset.nodeId = n.id;
        /* /byte: bits saved by this node, normalized over the WHOLE
         * source.  Lets you compare nodes' aggregate impact even
         * though they have different subtree sizes — and sum across
         * the table approximates the total bits-saved. */
        const sptok = totalN > 0
            ? (n.bitsSavedTotal / totalN).toFixed(4) : '-';
        const pctSrc = totalN > 0
            ? (100 * n.subtreeCount / totalN).toFixed(1) + '%' : '-';
        tr.innerHTML = `<td>${i + 1}</td><td>${n.depth}</td>` +
            `<td>${pctSrc}</td>` +
            `<td>${n.pLeft.toFixed(3)}</td>` +
            `<td>${n.bitEntropy.toFixed(3)}</td>` +
            `<td>${n.bitsSavedTotal.toFixed(0)}</td>` +
            `<td>${sptok}</td>` +
            `<td>${n.flatD ? `flat D=${n.flatD}` : (n.inFlat ? '∈flat' : '')}</td>`;
        tbody.appendChild(tr);
    }
}

let _freqs = null;
let _name = '(none)';
let _isMain = false;
let _totalN = 0;

function refreshFromFreqs() {
    if (!_freqs) return;
    const phOpt = document.getElementById('ph-opt').checked;
    const maxSkew = document.getElementById('max-skew').checked;
    const showFlat = document.getElementById('show-flat').checked;
    const condenseFlat = document.getElementById('condense-flat').checked;
    const noOverlap = document.getElementById('no-overlap').checked;
    const showSplitting = document.getElementById('splitting').checked;
    const showPrimitives = document.getElementById('show-primitives').checked;
    const showBitmaps = document.getElementById('show-bitmaps').checked;
    const inputBitmap = document.getElementById('input-bitmap').checked;
    const bitmapLabel = document.getElementById('bitmap-label').value;
    const titleText = document.getElementById('title-input').value;
    const showLabels = document.getElementById('show-labels').value;
    const showLeafDetails = document.getElementById('show-leaf-details').checked;
    const mode = document.getElementById('tree-mode').value;
    const viewMode = document.getElementById('view-mode').value;
    const constantDetect = document.getElementById('constant-detect').checked;
    const fuseLeaves = document.getElementById('fuse-leaves').checked;
    const showSkew = document.getElementById('show-skew').checked;
    const showBitPrefix = document.getElementById('show-bit-prefix').checked;
    const showLeafCode = document.getElementById('show-leaf-code').checked;
    const showBranchBits = document.getElementById('show-branch-bits').checked;
    const keysSort = document.getElementById('keys-sort').value;
    const maxLen = parseInt(document.getElementById('max-len').value, 10);
    document.getElementById('max-len-val').textContent = maxLen;
    const status = document.getElementById('status');
    const t0 = performance.now();

    let tree, codes;
    if (maxSkew) {
        /* Max-skew topology (same code lengths, leans left by frequency).
         * Derive the per-symbol code array from the built tree (path =
         * code, depth = length) so the tooltip / leaf-code views work. */
        tree = buildTreeMaxSkew(_freqs, maxLen);
        codes = [];
        (function collect(n, code, len) {
            if (!n) return;
            if (n.symbol >= 0) { codes.push({ symbol: n.symbol, code: code, len: len }); return; }
            collect(n.left,  code << 1,         len + 1);
            collect(n.right, (code << 1) | 1,   len + 1);
        })(tree, 0, 0);
    } else {
        const lens = buildHuffmanLengths(_freqs, maxLen);
        codes = phOpt ?
            assignPhFlatCodes(lens, _freqs, keysSort) :
            assignCanonicalCodes(lens);
        tree = buildTree(codes, _freqs);
    }
    annotateTree(tree);
    detectFlatSubtrees(tree);

    // Stash codes per leaf for the tooltip + bit-prefix per node for
    // the optional "internal prefix" / "leaf code" view toggles.
    const codeBySym = new Map();
    codes.forEach(c => codeBySym.set(c.symbol, c));
    function walkLeaves(n, prefix) {
        if (!n) return;
        n.bitPrefix = prefix;
        if (n.symbol >= 0) {
            const c = codeBySym.get(n.symbol);
            if (c) { n.code = c.code; n.codeLen = c.len; }
            return;
        }
        walkLeaves(n.left,  prefix + '0');
        walkLeaves(n.right, prefix + '1');
    }
    walkLeaves(tree, '');

    /* Stash for the text-layout export (download tree text). */
    currentCodes = codes;
    currentRawTree = tree;

    const sourceText = (_dataSource === 'text')
        ? document.getElementById('text-input').value
        : null;
    const meta = {
        name: _name, isMain: _isMain, totalN: _totalN,
        phOpt, maxSkew, showFlat, condenseFlat, noOverlap, showSplitting,
        showPrimitives, showBitmaps, inputBitmap, bitmapLabel, mode, viewMode,
        constantDetect, fuseLeaves,
        titleText, showLabels, sourceText,
        showLeafDetails, showSkew, showBitPrefix, showLeafCode,
        showBranchBits, keysSort, maxLen,
    };
    /* Tag each node with its decode primitive, then count ops along
     * each root-to-leaf primitive path.  Both must run before
     * computeTreeStats so ops/byte reflects the current toggles. */
    annotatePrimitives(tree, meta);
    annotateLeafOps(tree);

    /* Source-trace + per-node bitmaps — needed by either the
     * "show bitmaps" overlay (tree view) or the pivot view.  Both
     * require an actual input string, not just a frequency
     * distribution. */
    const needTrace = (meta.showBitmaps || meta.inputBitmap || meta.viewMode === 'pivot');
    if (needTrace && meta.sourceText) {
        meta.sourceTrace = buildSourceTrace(meta.sourceText, tree);
        /* Flat-absorb (D-bit grouped bitmap on flat roots) is a tree-view
         * rendering; the pivot view needs the full per-depth binary bitmaps,
         * including those inside flat subtrees. */
        annotateBitmaps(tree, meta.sourceTrace,
                        meta.showFlat && meta.viewMode !== 'pivot');
    } else {
        meta.sourceTrace = null;
        /* Clear any stale per-node bitmaps from a previous render. */
        (function clear(n) {
            if (!n) return;
            n.bitmap = null;
            clear(n.left); clear(n.right);
        })(tree);
    }
    /* Compute stats up-front so both renderTree (overlay) and
     * renderStats (panel) read from the same numbers. */
    meta.stats = computeTreeStats(tree, meta);
    renderTree(tree, meta);
    renderStats(tree, meta, meta.stats);

    const dt = (performance.now() - t0).toFixed(0);
    status.textContent = `built in ${dt} ms · ${codes.length} symbols`;
    /* Keep the filename placeholder in sync — it depends on the
     * currently-selected data source and a couple of toggles. */
    syncFilenamePlaceholder();
}

const STD_BLOCK = 8192;

/* For short inputs (file or text < STD_BLOCK bytes), treat the
 * frequencies as defining a distribution and scale up to a standard
 * block.  Otherwise small subtree counts make bits-saved numbers
 * round to 0.  Pre-built dataset distributions already come from
 * 8192-byte samples so this is mostly a no-op for them. */
function scaleFreqsToBlock(freqs) {
    const total = freqs.reduce((s, x) => s + x, 0);
    if (total === 0 || total >= STD_BLOCK) {
        return { scaled: freqs, original: total, scaled_total: total, was_scaled: false };
    }
    const scale = STD_BLOCK / total;
    const scaled = freqs.map(f => Math.round(f * scale));
    /* Rounding drift correction so the total is exactly STD_BLOCK. */
    let after = scaled.reduce((s, x) => s + x, 0);
    if (after !== STD_BLOCK) {
        const order = scaled.map((v, i) => [v, i])
                            .filter(p => p[0] > 0)
                            .sort((a, b) => b[0] - a[0]);
        let drift = STD_BLOCK - after;
        for (let i = 0; drift !== 0 && i < order.length; i++) {
            const idx = order[i][1];
            if (drift > 0) { scaled[idx]++; drift--; }
            else if (scaled[idx] > 1) { scaled[idx]--; drift++; }
        }
    }
    return { scaled, original: total, scaled_total: STD_BLOCK, was_scaled: true };
}

function setFreqs(freqs, name, isMain) {
    _flatOverride.clear();
    const sc = scaleFreqsToBlock(freqs);
    _freqs = sc.scaled;
    _totalN = sc.scaled_total;
    _name = sc.was_scaled
        ? `${name} (scaled ${sc.original}→${sc.scaled_total} for stats)`
        : name;
    _isMain = !!isMain;
    /* The minimum valid max-code-length is ceil(log2(#symbols)) so
     * the Huffman codes can address every distinct symbol.  Update
     * the slider's min and clamp its current value if needed. */
    const nSym = _freqs.filter(f => f > 0).length;
    const minLen = Math.max(1, Math.ceil(Math.log2(Math.max(2, nSym))));
    const slider = document.getElementById('max-len');
    slider.min = minLen;
    document.getElementById('max-len-min').textContent = minLen;
    if (+slider.value < minLen) slider.value = minLen;
    document.getElementById('max-len-val').textContent = slider.value;
    refreshFromFreqs();
}

function populateDatasetSelect() {
    const sel = document.getElementById('dataset-select');
    sel.innerHTML = '';
    const dists = window.PIVCO_DISTRIBUTIONS || [];
    /* MAIN sorted alphabetically by name, then non-MAIN sorted
     * alphabetically.  Result: calgary_pic shows up first (★). */
    const main    = dists.filter(d =>  d.is_main).slice().sort((a,b) => a.name.localeCompare(b.name));
    const nonMain = dists.filter(d => !d.is_main).slice().sort((a,b) => a.name.localeCompare(b.name));
    const ordered = main.concat(nonMain);
    ordered.forEach(d => {
        const o = document.createElement('option');
        o.value = d.name;
        o.textContent = (d.is_main ? '★ ' : '   ') + d.name;
        sel.appendChild(o);
    });
    sel.addEventListener('change', () => {
        const d = (window.PIVCO_DISTRIBUTIONS || []).find(x => x.name === sel.value);
        if (d) {
            _dataSource = 'dataset';
            setFreqs(d.freq, d.name, d.is_main);
        }
        updateUrlFromState();
    });
    /* Note: first-render is no longer triggered here.  loadInitialData()
     * below picks dataset vs. text vs. URL-default after all controls
     * have been initialised. */
}

function setupFileInput() {
    document.getElementById('file-input').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = ev => {
            const buf = new Uint8Array(ev.target.result);
            const freq = new Array(256).fill(0);
            for (let i = 0; i < buf.length; i++) freq[buf[i]]++;
            _dataSource = 'file';   /* file path isn't URL-capturable */
            setFreqs(freq, `file:${f.name}`, false);
            updateUrlFromState();
        };
        reader.readAsArrayBuffer(f);
    });
}

function setupToggles() {
    /* Every toggle change refreshes the render AND updates the URL bar
     * so the visible permalink always reflects current state.  Toggles
     * that affect flat-subtree state also need to clear the override
     * set (otherwise per-node manual flatten toggles leak across
     * unrelated control changes). */
    const refreshAndUrl = () => { refreshFromFreqs(); updateUrlFromState(); };
    const refreshClearAndUrl = () => {
        _flatOverride.clear(); refreshFromFreqs(); updateUrlFromState();
    };
    document.getElementById('ph-opt').addEventListener('change', refreshClearAndUrl);
    document.getElementById('max-skew').addEventListener('change', refreshClearAndUrl);
    document.getElementById('show-flat').addEventListener('change', refreshClearAndUrl);
    document.getElementById('condense-flat').addEventListener('change', refreshClearAndUrl);
    document.getElementById('no-overlap').addEventListener('change', refreshAndUrl);
    document.getElementById('splitting').addEventListener('change', refreshAndUrl);
    document.getElementById('show-primitives').addEventListener('change', refreshAndUrl);
    document.getElementById('show-bitmaps').addEventListener('change', refreshAndUrl);
    document.getElementById('input-bitmap').addEventListener('change', refreshAndUrl);
    document.getElementById('bitmap-label').addEventListener('change', refreshAndUrl);
    document.getElementById('view-mode').addEventListener('change', refreshAndUrl);
    document.getElementById('tree-mode').addEventListener('change', refreshAndUrl);
    document.getElementById('constant-detect').addEventListener('change', refreshClearAndUrl);
    document.getElementById('fuse-leaves').addEventListener('change', refreshClearAndUrl);
    document.getElementById('title-input').addEventListener('input', refreshAndUrl);
    document.getElementById('show-labels').addEventListener('input', refreshAndUrl);
    document.getElementById('show-leaf-details').addEventListener('change', refreshAndUrl);
    document.getElementById('show-skew').addEventListener('change', refreshAndUrl);
    document.getElementById('show-bit-prefix').addEventListener('change', refreshAndUrl);
    document.getElementById('show-leaf-code').addEventListener('change', refreshAndUrl);
    document.getElementById('show-branch-bits').addEventListener('change', refreshAndUrl);
    document.getElementById('keys-sort').addEventListener('change', refreshClearAndUrl);
    document.getElementById('max-len').addEventListener('input', refreshClearAndUrl);
    document.getElementById('reset-view').addEventListener('click', resetView);
    document.getElementById('reset-params').addEventListener('click', resetParams);
    /* Filename: if the user typed something, use it; else fall back to
     * the placeholder (the auto-generated name).  Also keep the URL
     * in sync when the user edits this field. */
    const fnameEl = document.getElementById('download-filename');
    fnameEl.addEventListener('input', updateUrlFromState);
    document.getElementById('crop-top').addEventListener('input', refreshAndUrl);
    document.getElementById('download-svg').addEventListener('click', () => {
        const explicit = fnameEl.value.trim();
        const fname = explicit || fnameEl.placeholder || 'tree.svg';
        downloadCurrentSvg(fname);
    });
    document.getElementById('download-txt').addEventListener('click', () => {
        const explicit = fnameEl.value.trim();
        const base = (explicit || fnameEl.placeholder || 'tree.svg').replace(/\.svg$/i, '');
        downloadText(base + '.txt', serializeTreeText());
    });
}

function buildFromText(s) {
    if (!s) return;
    const bytes = new TextEncoder().encode(s);
    const freq = new Array(256).fill(0);
    for (let i = 0; i < bytes.length; i++) freq[bytes[i]]++;
    setFreqs(freq, `text:${s.length < 30 ? s : s.slice(0, 27) + '…'}`, false);
}

function setupTextInput() {
    const txt = document.getElementById('text-input');
    const btn = document.getElementById('text-build');
    const build = () => {
        if (!txt.value) return;
        _dataSource = 'text';
        buildFromText(txt.value);
        updateUrlFromState();
    };
    btn.addEventListener('click', build);
    txt.addEventListener('keydown', e => { if (e.key === 'Enter') build(); });
    /* Example chips: clicking one fills the textbox and triggers build. */
    document.querySelectorAll('a.text-example').forEach(el => {
        el.addEventListener('click', (e) => {
            e.preventDefault();
            txt.value = el.dataset.text || '';
            build();
        });
    });
}

function parseUrlParams() {
    return new URLSearchParams(window.location.search);
}

/* Apply URL → control values.  Called once at load, before data is
 * picked, so the first render happens with URL-driven settings. */
function applyUrlParamsToControls() {
    const q = parseUrlParams();
    for (const m of URL_PARAM_MAP) {
        if (!q.has(m.param)) continue;
        const el = document.getElementById(m.id);
        if (!el) continue;
        const v = q.get(m.param);
        if (m.kind === 'bool') {
            el.checked = (v === '1' || v === 'true');
        } else {
            el.value = v;
        }
    }
}

/* Reset every URL-managed control to its HTML-default state and
 * trigger a re-render + URL-bar update.  Per-node flat-overrides are
 * cleared too so the "show me the default flat detection" view is
 * restored. */
function resetParams() {
    for (const m of URL_PARAM_MAP) {
        const el = document.getElementById(m.id);
        if (!el) continue;
        if (m.kind === 'bool') {
            el.checked = el.defaultChecked;
        } else if (el.tagName === 'SELECT') {
            /* Find the option marked default-selected in HTML. */
            for (const o of el.options) {
                if (o.defaultSelected) { el.value = o.value; break; }
            }
        } else {
            el.value = el.defaultValue;
        }
    }
    _flatOverride.clear();
    refreshFromFreqs();
    updateUrlFromState();
    /* Filename input has no HTML default value other than '' — clear it
     * so the placeholder (auto-generated name) shows. */
    document.getElementById('download-filename').value = '';
    syncFilenamePlaceholder();
}

/* Keep the filename input's placeholder in sync with the auto-generated
 * default so users see what would be written if they leave it empty. */
function syncFilenamePlaceholder() {
    const el = document.getElementById('download-filename');
    if (!el) return;
    el.placeholder = defaultDownloadFilename();
}

/* Tooltip wiring: hover any control with documentation in URL_PARAM_MAP
 * or DATA_PARAM_DOCS → show a rich tooltip with the description + the
 * URL parameter name and possible values in bold at the bottom. */
function tooltipHtmlFor(doc) {
    return `${doc.desc}<br><br>URL: <b>${doc.param}=${doc.values}</b>`;
}
function setupControlTooltips() {
    const all = URL_PARAM_MAP.concat(DATA_PARAM_DOCS);
    for (const m of all) {
        const el = document.getElementById(m.id);
        if (!el) continue;
        /* Attach to the wrapping <label> if present (covers checkbox +
         * its text), else to the element itself. */
        const target = el.closest('label') || el;
        target.addEventListener('mousemove', (e) => showTooltip(tooltipHtmlFor(m), e));
        target.addEventListener('mouseleave', hideTooltip);
        /* Strip any pre-existing native title attribute so the browser
         * doesn't double-show the truncated text version. */
        target.removeAttribute('title');
    }
}

/* Tracks which UI affordance produced the currently-displayed data,
 * so updateUrlFromState() knows whether to write text=, dataset=, or
 * neither (file-loaded data isn't capturable in a URL). */
let _dataSource = 'dataset';   /* one of 'dataset' | 'text' | 'file' */

// ============================================================
//  SVG export — clone the current view, strip the zoom transform,
//  embed the SVG-relevant CSS, set width/height/viewBox to the
//  content bbox, then trigger a download.  Output is a standalone
//  .svg file suitable for paper inclusion.
// ============================================================

/* Collect the page's CSS rules that target #tree-svg so the exported
 * file renders the same standalone.  Walks document.styleSheets at
 * runtime so we stay in sync with the source CSS without duplication. */
function collectTreeSvgCss() {
    const out = [];
    for (const sheet of document.styleSheets) {
        let rules;
        try { rules = sheet.cssRules; } catch (e) { continue; }  /* CORS */
        if (!rules) continue;
        for (const rule of rules) {
            if (!rule.selectorText) continue;
            if (rule.selectorText.indexOf('#tree-svg') === -1) continue;
            out.push(rule.cssText);
        }
    }
    return out.join('\n');
}

/* The crop-top export fraction (top portion of the tree to keep), or
 * null when unset / >=1 (whole tree).  Shared by the SVG export and the
 * live fit-to-pane preview so the on-screen framing matches the export. */
function getCropTopFrac() {
    const el = document.getElementById('crop-top');
    const v = el ? parseFloat(el.value) : NaN;
    return (!isNaN(v) && v > 0 && v < 1) ? v : null;
}

/* Serialize the built tree as text, for cross-checking the JS-rendered
 * figure against the C production builder (extras/dump_tree_text).  Two
 * sections, both deterministic from the code lengths (toggle-invariant):
 *   ## codes  — per-symbol (symbol, length, canonical code), sorted by symbol
 *   ## tree   — pre-order walk (0=left,1=right): each LEAF and each maximal
 *               FLAT subtree (D>=2), the latter with its member symbols in
 *               local-code order.  Flat roots are not descended into, mirroring
 *               the production tree which does not materialize flat leaves. */
function serializeTreeText() {
    const m = currentMeta, codes = currentCodes, tree = currentRawTree;
    if (!m || !codes || !tree) return '';
    const out = [];
    const actualMaxLen = codes.reduce((mx, c) => Math.max(mx, c.len), 0);
    out.push('# tree_viz tree layout dump');
    out.push(`# dist=${m.name} phOpt=${m.phOpt ? 1 : 0} maxSkew=${m.maxSkew ? 1 : 0}`
           + ` keysSort=${m.keysSort} maxLen=${actualMaxLen} nsyms=${codes.length}`);
    out.push('## codes  (symbol length code)');
    codes.slice().sort((a, b) => a.symbol - b.symbol).forEach(c => {
        out.push(`${c.symbol} ${c.len} ${(c.code >>> 0).toString(2).padStart(c.len, '0')}`);
    });
    out.push('## tree  (path kind detail; path 0=left 1=right, "." = root)');
    (function walk(n) {
        if (!n) return;
        const path = n.bitPrefix === '' ? '.' : n.bitPrefix;
        if (n.symbol < 0 && n.flatD >= 2) {
            const syms = [];
            (function leaves(x) {
                if (!x) return;
                if (x.symbol >= 0) { syms.push(x.symbol); return; }
                leaves(x.left); leaves(x.right);
            })(n);
            out.push(`${path} FLAT D=${n.flatD} syms=${syms.join(',')}`);
            return;                       /* maximal — don't descend */
        }
        if (n.symbol >= 0) {
            out.push(`${path} LEAF sym=${n.symbol} len=${n.bitPrefix.length}`);
            return;
        }
        walk(n.left); walk(n.right);
    })(tree);
    return out.join('\n') + '\n';
}

function downloadText(filename, text) {
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename || 'tree.txt';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function downloadCurrentSvg(filename) {
    if (!filename) filename = 'tree.svg';
    const orig = document.getElementById('tree-svg');
    if (!orig) return;

    /* Clone the SVG subtree and strip the pan/zoom transform on gWorld
     * — we want the exported file at 1:1 with no scroll state baked in. */
    const clone = orig.cloneNode(true);
    const gWorldClone = clone.querySelector('g');
    if (gWorldClone) gWorldClone.removeAttribute('transform');
    /* The crop preview (cut line + dimmed region) is a live-view aid,
     * not part of the figure — drop it from the exported clone. */
    clone.querySelectorAll('.crop-overlay').forEach(e => e.remove());

    /* Measure unzoomed content via the LIVE gWorld (the clone isn't in
     * the document so getBBox would return zeros).  Pad a little. */
    const bbox = gWorld.node().getBBox();
    const pad = 12;

    /* Optional top-crop: keep only the top fraction of the tree height
     * AND narrow the width to the kept nodes' x-extent (_cropExportBox,
     * computed in the tree render).  Content outside is clipped by the
     * SVG viewport.  Empty / >=1 / no box = whole tree. */
    const cropTop = getCropTopFrac();
    const contentH = cropTop ? bbox.height * cropTop : bbox.height;
    const cb = (cropTop && _cropExportBox) ? _cropExportBox : null;
    const vbX = cb ? cb.x : bbox.x;
    const vbW = cb ? cb.w : bbox.width;

    const exportW = Math.max(1, Math.ceil(vbW      + 2 * pad));
    const exportH = Math.max(1, Math.ceil(contentH + 2 * pad));
    clone.setAttribute('width',  exportW);
    clone.setAttribute('height', exportH);
    clone.setAttribute('viewBox',
        `${vbX - pad} ${bbox.y - pad} ${exportW} ${exportH}`);

    /* Inline the #tree-svg stylesheet so the .svg renders without the
     * page's <style> block.  Prepended via SVG <style> element. */
    const css = collectTreeSvgCss();
    if (css) {
        const styleEl = document.createElementNS(
            'http://www.w3.org/2000/svg', 'style');
        styleEl.textContent = css;
        clone.insertBefore(styleEl, clone.firstChild);
    }

    clone.setAttribute('xmlns',       'http://www.w3.org/2000/svg');
    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');

    const svgText = '<?xml version="1.0" standalone="no"?>\n' +
                     new XMLSerializer().serializeToString(clone);

    /* Trigger download via a temporary anchor.  Note: in regular
     * browsers this requires a recent user gesture (clicking the
     * download button); when the page is driven by a headless tool
     * like Playwright the gesture-or-permission check is bypassed. */
    const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    /* Revoke after a short delay so the browser has time to consume
     * the blob (some browsers race on instant revoke). */
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* Default download filename: derived from the data source + a
 * couple of distinguishing toggles, so multiple downloads from
 * the same session don't collide. */
function defaultDownloadFilename() {
    let stem;
    if (_dataSource === 'text') {
        const t = document.getElementById('text-input').value || 'text';
        stem = 'text-' + t.replace(/[^a-z0-9]+/gi, '_').slice(0, 20);
    } else if (_dataSource === 'dataset') {
        stem = document.getElementById('dataset-select').value || 'tree';
    } else {
        stem = 'tree';
    }
    if (document.getElementById('ph-opt').checked) stem += '-phopt';
    if (document.getElementById('condense-flat').checked) stem += '-folded';
    return stem + '.svg';
}

/* Build a URL search string from current control state.  Includes
 * data source: text=... if a text was built, dataset=... if a preset
 * is selected, neither for file-loaded data.  Booleans only included
 * when they differ from the HTML-default state, so default-shaped
 * URLs stay short. */
function updateUrlFromState() {
    const q = new URLSearchParams();
    if (_dataSource === 'text') {
        const t = document.getElementById('text-input').value;
        if (t) q.set('text', t);
    } else if (_dataSource === 'dataset') {
        const n = document.getElementById('dataset-select').value;
        if (n) q.set('dataset', n);
    }
    /* Controls — include only if they differ from HTML defaults so
     * default views produce clean URLs. */
    for (const m of URL_PARAM_MAP) {
        const el = document.getElementById(m.id);
        if (!el) continue;
        if (m.kind === 'bool') {
            const cur = !!el.checked;
            const def = el.hasAttribute('checked');
            if (cur !== def) q.set(m.param, cur ? '1' : '0');
        } else {
            const cur = el.value;
            const def = el.defaultValue;
            if (cur !== def) q.set(m.param, cur);
        }
    }
    const s = q.toString();
    const url = s ? `${window.location.pathname}?${s}` : window.location.pathname;
    history.replaceState(null, '', url);
}

/* Choose initial data: URL text= → URL dataset= → first dataset.
 * Run AFTER applyUrlParamsToControls so the render uses URL settings. */
function loadInitialData() {
    const q = parseUrlParams();
    const dists = window.PIVCO_DISTRIBUTIONS || [];

    if (q.has('text')) {
        const s = q.get('text');
        document.getElementById('text-input').value = s;
        _dataSource = 'text';
        buildFromText(s);
        return;
    }
    if (q.has('dataset')) {
        const name = q.get('dataset');
        const d = dists.find(x => x.name === name);
        if (d) {
            const sel = document.getElementById('dataset-select');
            sel.value = name;
            _dataSource = 'dataset';
            setFreqs(d.freq, d.name, d.is_main);
            return;
        }
    }
    /* Default: first dataset (preserves pre-URL-params behaviour). */
    if (dists.length > 0) {
        /* Replicate the MAIN-first ordering used in populateDatasetSelect. */
        const main    = dists.filter(d =>  d.is_main).slice().sort((a,b) => a.name.localeCompare(b.name));
        const nonMain = dists.filter(d => !d.is_main).slice().sort((a,b) => a.name.localeCompare(b.name));
        const first = main.concat(nonMain)[0];
        _dataSource = 'dataset';
        setFreqs(first.freq, first.name, first.is_main);
    }
}

/* Hover over a row in the top-N table → temporarily highlight the
 * corresponding internal node in the SVG. */
let _highlightedNodeId = null;
function highlightNode(nodeId) {
    if (_highlightedNodeId != null) {
        const old = gWorld.select(`g.node-internal[data-node-id="${_highlightedNodeId}"]`);
        if (!old.empty()) {
            /* Use .style() because the base CSS has `fill: #fff` for
             * .node-internal circle and CSS selectors beat attribute
             * defaults; inline style overrides them. */
            old.select('circle')
                .attr('r', 4)
                .style('fill', null)
                .style('stroke', null);
        }
    }
    _highlightedNodeId = nodeId;
    if (nodeId == null) return;
    const sel = gWorld.select(`g.node-internal[data-node-id="${nodeId}"]`);
    if (sel.empty()) return;
    sel.select('circle')
        .attr('r', 8)
        .style('fill', '#e53935')        /* red fill */
        .style('stroke', '#a31515');     /* darker red border */
    /* Bring into view: pan if outside the visible area.  Get the
     * node's screen-space position. */
    const node = sel.datum();
    const t = d3.zoomTransform(svg.node());
    const sx = t.applyX(node.x), sy = t.applyY(node.y);
    const pane = document.getElementById('tree-pane');
    const W = pane.clientWidth, H = pane.clientHeight;
    if (sx < 40 || sx > W - 40 || sy < 40 || sy > H - 40) {
        const cx = W / 2, cy = H / 2;
        const newT = d3.zoomIdentity.translate(cx - t.k * node.x,
                                                cy - t.k * node.y).scale(t.k);
        svg.transition().duration(220).call(zoom.transform, newT);
    }
}

function setupTopTableHover() {
    const tbody = document.querySelector('#top-nodes-table tbody');
    tbody.addEventListener('mouseover', e => {
        const tr = e.target.closest('tr');
        if (!tr) return;
        const id = tr.dataset.nodeId;
        if (id == null) return;
        highlightNode(+id);
        const node = _nodeById.get(+id);
        if (node) showTooltip(nodeTooltipHtml(node, _totalN), e);
    });
    tbody.addEventListener('mousemove', e => {
        const tr = e.target.closest('tr');
        if (!tr) return;
        const id = tr.dataset.nodeId;
        if (id == null) return;
        const node = _nodeById.get(+id);
        if (node) showTooltip(nodeTooltipHtml(node, _totalN), e);
    });
    tbody.addEventListener('mouseleave', () => { highlightNode(null); hideTooltip(); });
}

window.addEventListener('load', () => {
    initSvg();
    populateDatasetSelect();   /* fills the dropdown but does NOT pick data */
    setupFileInput();
    setupTextInput();
    setupToggles();
    setupTopTableHover();
    setupControlTooltips();
    /* URL params drive both the control state AND the initial data
     * source.  Apply controls first, THEN load data so the first
     * render reflects URL-driven settings. */
    applyUrlParamsToControls();
    loadInitialData();
    /* Optional auto-download: when ?download=filename.svg is in the
     * URL, fire off a download after the first render settles.  Works
     * reliably under Playwright/Puppeteer; regular browsers may block
     * the download without a user gesture, which is fine — the user
     * can click the button instead. */
    const q = parseUrlParams();
    if (q.has('download')) {
        setTimeout(() => downloadCurrentSvg(q.get('download')), 150);
    }
});
window.addEventListener('resize', () => {
    if (currentTree) renderTree(currentTree, currentMeta);
});
</script>

</body>
